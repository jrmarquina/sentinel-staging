name: Deploy to Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: true   # newer push cancels in-flight staging deploy

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No explicit version — reads packageManager field from package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

  deploy:
    name: Deploy
    needs: typecheck
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to VPS (staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            REPO_DIR="/srv/sentinel/staging/municipal-public-works"
            ENV_FILE="/srv/sentinel/staging/.env.staging"

            # Clone staging repo on first deploy if not present
            if [ ! -d "$REPO_DIR/.git" ]; then
              rm -rf "$REPO_DIR"
              mkdir -p /srv/sentinel/staging
              git clone -b staging \
                https://github.com/jrmarquina/sentinel-staging.git \
                "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin
            git checkout staging
            git reset --hard origin/staging

            # Load staging env for build-time NEXT_PUBLIC_ vars
            set -a
            [ -f "$ENV_FILE" ] && source "$ENV_FILE"
            set +a

            pnpm install --frozen-lockfile
            pnpm --filter web build

            # Reload Next.js staging process
            if pm2 describe sentinel-mpw-staging > /dev/null 2>&1; then
              pm2 reload sentinel-mpw-staging --update-env
            else
              pm2 start "$REPO_DIR/ecosystem.config.js" --only sentinel-mpw-staging
            fi
            pm2 save

            # NOTE: Supabase staging stack is managed as infrastructure (not restarted on app deploys).
            # To restart it manually: ssh into VPS and run:
            #   docker compose -p supabase-staging --env-file /srv/sentinel/staging/supabase/.env \
            #     -f /srv/sentinel/staging/municipal-public-works/docker-compose.staging.yml up -d

            # Verify staging health
            sleep 15
            if curl -sf http://localhost:3002/api/health; then
              echo "✓ Staging health check passed"
            else
              echo "⚠ Staging health check failed — expected until .env.staging is provisioned on the VPS"
            fi

            echo "Staging deploy complete"
