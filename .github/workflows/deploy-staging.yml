name: Deploy to Staging

on:
  push:
    branches:
      - staging

concurrency:
  group: deploy-staging
  cancel-in-progress: true   # newer push cancels in-flight staging deploy

jobs:
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

  deploy:
    name: Deploy
    needs: typecheck
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy to VPS (staging)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 40m   # Next.js build on shared 4-vCPU VPS can take 25-30min under load
          script: |
            set -e
            REPO_DIR="/srv/sentinel/staging/municipal-public-works"
            ENV_FILE="/srv/sentinel/staging/.env.staging"

            # Clone staging repo on first deploy if not present
            if [ ! -d "$REPO_DIR/.git" ]; then
              rm -rf "$REPO_DIR"
              mkdir -p /srv/sentinel/staging
              git clone -b staging \
                https://github.com/jrmarquina/sentinel-staging.git \
                "$REPO_DIR"
            fi

            cd "$REPO_DIR"
            git fetch origin
            git checkout staging
            git reset --hard origin/staging

            # Load staging env for build-time NEXT_PUBLIC_ vars.
            # Line-by-line parsing avoids bash treating credential values
            # containing / $ ! etc. as commands (exits 126 "Is a directory").
            if [ -f "$ENV_FILE" ]; then
              while IFS= read -r line || [ -n "$line" ]; do
                [[ -z "$line" || "$line" == \#* ]] && continue
                key="${line%%=*}"; val="${line#*=}"
                [[ -n "$key" ]] && export "$key"="$val"
              done < "$ENV_FILE"
            fi

            pnpm install --frozen-lockfile

            # ── Apply pending DB migrations via Docker (psql lives in container) ──
            if [ -f "$ENV_FILE" ]; then
              PG_PWD=$(grep '^POSTGRES_PASSWORD=' "$ENV_FILE" | cut -d= -f2- | tr -d '"' | tr -d "'")
              PSQL="docker exec -e PGPASSWORD=$PG_PWD supabase-staging-db-1 psql -U postgres -d postgres"

              # Create migration tracking table if it doesn't exist
              $PSQL -c "CREATE TABLE IF NOT EXISTS _migrations (filename TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT NOW());" 2>/dev/null || true

              # Run each migration file that hasn't been recorded yet
              for f in "$REPO_DIR"/supabase/migrations/*.sql; do
                fname=$(basename "$f")
                # Never auto-apply seed data migrations to the real staging DB
                if echo "$fname" | grep -qE '_seed|_demo|_fixture'; then
                  echo "Skipping seed migration: $fname"
                  $PSQL -c "INSERT INTO _migrations(filename) VALUES ('$fname') ON CONFLICT DO NOTHING;" 2>/dev/null || true
                  continue
                fi
                already=$($PSQL -tAc "SELECT COUNT(*) FROM _migrations WHERE filename = '$fname';" 2>/dev/null || echo "0")
                if [ "$already" = "0" ]; then
                  echo "Applying migration: $fname"
                  docker exec -e PGPASSWORD=$PG_PWD -i supabase-staging-db-1 psql -U postgres -d postgres < "$f" \
                    && $PSQL -c "INSERT INTO _migrations(filename) VALUES ('$fname') ON CONFLICT DO NOTHING;" \
                    || echo "⚠ Migration $fname failed — continuing"
                fi
              done
            fi

            # Auto-increment build number before building.
            # VPS_BUILD_FILE lives outside the repo so git reset --hard doesn't wipe it.
            REPO_VER_FILE="$REPO_DIR/apps/web/version.txt"
            VPS_BUILD_FILE="/srv/sentinel/staging/build-number.txt"
            BASE=$(cat "$REPO_VER_FILE" 2>/dev/null | tr -d '[:space:]' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || echo "1.1.0")
            LAST_BUILD=$(cat "$VPS_BUILD_FILE" 2>/dev/null | tr -d '[:space:]' || echo "0")
            NEW_BUILD=$((LAST_BUILD + 1))
            NEW_VERSION="${BASE}.${NEW_BUILD}"
            echo "$NEW_BUILD" > "$VPS_BUILD_FILE"
            # Strip any stale APP_VERSION lines then append fresh one
            grep -v '^NEXT_PUBLIC_APP_VERSION=' "$REPO_DIR/apps/web/.env.local" > /tmp/env_clean 2>/dev/null || true
            mv /tmp/env_clean "$REPO_DIR/apps/web/.env.local" 2>/dev/null || true
            echo "NEXT_PUBLIC_APP_VERSION=${NEW_VERSION}" >> "$REPO_DIR/apps/web/.env.local"
            echo "Building version $NEW_VERSION"

            # Limit to 2 webpack workers to reduce CPU contention with running services
            NODE_OPTIONS="--max-old-space-size=3072" NEXT_WEBPACK_WORKER_THREADS=2 pnpm --filter web build

            # Reload Next.js staging process
            if pm2 describe sentinel-mpw-staging > /dev/null 2>&1; then
              pm2 reload sentinel-mpw-staging --update-env
            else
              pm2 start "$REPO_DIR/ecosystem.config.js" --only sentinel-mpw-staging
            fi
            pm2 save

            # Verify staging health
            sleep 15
            if curl -sf http://localhost:3002/api/health; then
              echo "✓ Staging health check passed"
            else
              echo "⚠ Staging health check failed"
            fi

            # Refresh graphify knowledge graph (AST-only, non-blocking).
            # GRAPHIFY_FORCE accepts rebuilds with fewer nodes after file deletions.
            if command -v "$HOME/.local/bin/graphify" > /dev/null 2>&1; then
              GRAPHIFY_FORCE=1 nice -n 10 "$HOME/.local/bin/graphify" update . \
                || echo "⚠ graphify update failed — continuing"
            fi

            echo "Staging deploy complete"
