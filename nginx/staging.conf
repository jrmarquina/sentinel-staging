# =============================================================
# Nginx — Staging Subdomain Configuration
#
# Drop this file at /etc/nginx/sites-available/sentinel-staging
# then: sudo ln -s /etc/nginx/sites-available/sentinel-staging \
#               /etc/nginx/sites-enabled/sentinel-staging
#       sudo nginx -t && sudo systemctl reload nginx
#
# Prerequisites:
#   1. DNS A record: staging.yourdomain.com → VPS IP
#   2. DNS A record: staging-db.yourdomain.com → VPS IP  (optional, for Studio/API)
#   3. SSL certificates issued:
#      sudo certbot --nginx -d staging.yourdomain.com -d staging-db.yourdomain.com
#
# Replace ALL occurrences of "yourdomain.com" with the real domain.
# =============================================================

# ── Staging Next.js App ───────────────────────────────────────
server {
    listen 80;
    server_name staging.yourdomain.com;
    # Certbot will redirect this to HTTPS automatically
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging.yourdomain.com;

    # Managed by Certbot — update paths after running certbot
    ssl_certificate /etc/letsencrypt/live/staging.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Environment "staging" always;

    # Access logging (separate from prod)
    access_log /var/log/nginx/sentinel-staging-access.log;
    error_log  /var/log/nginx/sentinel-staging-error.log;

    # Pass to PM2 / Next.js staging process on port 3002
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Never cache HTML — ensures browsers always get the latest JS bundle
        # after a redeploy (prevents "Failed to find Server Action" errors)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;

        # Next.js streaming / ISR support
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Next.js static assets — long cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ── Staging Supabase API (Kong) ───────────────────────────────
# Exposes staging Supabase API at staging-db.yourdomain.com
# The Next.js staging app's NEXT_PUBLIC_SUPABASE_URL points here.
server {
    listen 80;
    server_name staging-db.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name staging-db.yourdomain.com;

    ssl_certificate /etc/letsencrypt/live/staging-db.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging-db.yourdomain.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Environment "staging" always;

    access_log /var/log/nginx/sentinel-staging-db-access.log;
    error_log  /var/log/nginx/sentinel-staging-db-error.log;

    # Max upload size for Storage
    client_max_body_size 50m;

    # Proxy to staging Kong API gateway (port 8100)
    location / {
        proxy_pass http://127.0.0.1:8100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Realtime WebSocket connections need longer timeout
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

