<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sentinel · Weather Operations · Puerto Rico</title>
<meta name="description" content="Live weather alerts, tropical storm tracking, and NHC bulletins for Puerto Rico. Updated every 5 minutes from NWS, NHC, and NMEAD.">
<meta property="og:title" content="Sentinel Weather Operations · Puerto Rico">
<meta property="og:description" content="Live NWS alerts, tropical storm tracking, and 7-day forecast for Puerto Rico.">

<style>
  :root {
    --black:        #000000;
    --white:        #ffffff;
    --gray-bg:      #f9f9f9;
    --gray-border:  #eeeeee;
    --gray-text:    #666666;
    --gray-dim:     #999999;
    --gray-deep:    #333333;
    --accent:       #1a1a1a;

    --crit:         #c41818;
    --crit-bg:      #fdf2f2;
    --warn:         #d97706;
    --warn-bg:      #fef9ec;
    --info:         #1e5fb8;
    --info-bg:      #eaf2fc;
    --calm:         #2d5f3f;
    --calm-bg:      #f0f5f1;

    --f-sans: "Avenir Next", "Helvetica Neue", Arial, sans-serif;
    --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  html[data-theme="dark"] {
    --black: #ffffff;
    --white: #0a0a0a;
    --gray-bg: #141414;
    --gray-border: #232323;
    --gray-text: #999999;
    --gray-dim: #666666;
    --gray-deep: #cccccc;
    --crit-bg: rgba(196,24,24,.12);
    --warn-bg: rgba(217,119,6,.10);
    --info-bg: rgba(30,95,184,.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--white); color: var(--black); font-family: var(--f-sans); -webkit-font-smoothing: antialiased; }
  body { line-height: 1.5; min-height: 100vh; }
  button { font: inherit; cursor: pointer; border: none; background: transparent; color: inherit; }
  a { color: inherit; text-decoration: none; }
  ul { list-style: none; }
  ::selection { background: var(--black); color: var(--white); }
  .mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
  .label { text-transform: uppercase; font-size: 10px; letter-spacing: 0.2em; color: var(--gray-text); font-weight: 700; }
  .label-sm { text-transform: uppercase; font-size: 9px; letter-spacing: 0.18em; color: var(--gray-text); font-weight: 700; }

  /* HEADER */
  header.app-header {
    width: 100%; border-bottom: 1px solid var(--gray-border);
    padding: 14px 0; background: var(--white);
    position: sticky; top: 0; z-index: 1000;
  }
  .header-container {
    max-width: 1920px; margin: 0 auto; padding: 0 32px;
    display: flex; justify-content: space-between; align-items: center; gap: 24px;
  }
  .brand-block { display: flex; align-items: center; gap: 14px; flex-shrink: 0; }
  .main-logo { height: 22px; width: auto; display: block; }
  html[data-theme="dark"] .main-logo { filter: invert(1); }
  .section-pill {
    font-size: 9px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--gray-text); padding: 3px 8px; border: 1px solid var(--gray-border); white-space: nowrap;
  }
  .section-pill.live { color: var(--crit); border-color: var(--crit); }
  .main-nav { display: flex; align-items: center; gap: 24px; }
  .nav-links { display: flex; gap: 22px; }
  .nav-links a {
    text-transform: uppercase; font-size: 10.5px; letter-spacing: 0.15em; font-weight: 600;
    transition: opacity .2s; white-space: nowrap;
  }
  .nav-links a:hover { opacity: 0.6; }
  .nav-links a.active { border-bottom: 1.5px solid var(--black); padding-bottom: 4px; }
  .header-right { display: flex; align-items: center; gap: 18px; }
  .live-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--gray-text); font-weight: 600;
    padding-right: 18px; border-right: 1px solid var(--gray-border);
  }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--crit); animation: blink 1.6s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
  .language-switcher { display: flex; gap: 12px; align-items: center; }
  .flag-icon { width: 20px; height: 14px; cursor: pointer; display: block; }
  .flag-gray { filter: grayscale(100%); opacity: 0.3; pointer-events: none; cursor: default; }
  .btn-signin {
    padding: 8px 14px; border: 1px solid var(--black); background: var(--black); color: var(--white);
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 700; transition: all .2s;
  }
  .btn-signin:hover { background: transparent; color: var(--black); }

  /* STATUS BAR — replaces hero strip, compact single-line */
  .status-bar {
    border-bottom: 1px solid var(--gray-border);
    background: var(--white);
    display: flex; align-items: stretch; overflow: hidden;
  }
  .sb-segment {
    display: flex; align-items: center; gap: 10px; padding: 10px 20px;
    border-right: 1px solid var(--gray-border);
    flex-shrink: 0;
  }
  .sb-segment:last-child { border-right: 0; margin-left: auto; }
  .sb-season {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.25em; font-weight: 700;
    color: var(--gray-text);
  }
  .sb-status {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 700;
    flex: 1; padding: 10px 20px; display: flex; align-items: center;
  }
  .sb-status .count { color: var(--crit); }
  .sb-status.storm-mode { background: var(--crit-bg); border-bottom: 2px solid var(--crit); }
  .sb-status.watch-mode { background: var(--warn-bg); border-bottom: 2px solid var(--warn); }
  .sb-alerts {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700;
    display: flex; align-items: center; gap: 8px;
  }
  .sb-alert-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--gray-dim); }
  .sb-alert-dot.has-warn { background: var(--warn); }
  .sb-alert-dot.has-crit { background: var(--crit); animation: pulse-dot 1.8s ease-in-out infinite; }
  @keyframes pulse-dot { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .sb-sync { font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gray-text); font-family: var(--f-mono); }

  .active-threat-banner {
    display: flex; align-items: stretch; border: 1px solid var(--crit); background: var(--crit-bg); overflow: hidden;
  }
  .atb-tag {
    background: var(--crit); color: white; padding: 14px 16px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 800;
    display: flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .atb-swirl { animation: spin 6s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(-360deg); } }
  .atb-body { flex: 1; padding: 10px 18px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .atb-body .name { font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; }
  .atb-body .meta { font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gray-deep); font-weight: 600; margin-top: 2px; }
  .atb-stats { display: flex; gap: 18px; }
  .atb-stat { display: flex; flex-direction: column; align-items: flex-start; }
  .atb-stat .v { font-family: var(--f-mono); font-size: 14px; font-weight: 800; color: var(--crit); }
  .atb-stat .l { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--gray-text); font-weight: 700; }
  .atb-cta {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 700;
    color: var(--crit); border: 1px solid var(--crit); padding: 10px 14px; background: white; white-space: nowrap;
  }
  .atb-cta:hover { background: var(--crit); color: white; }

  /* no-storm hero: just show active alerts count */
  .alert-count-banner {
    display: flex; align-items: center; gap: 14px;
    border: 1px solid var(--gray-border); padding: 14px 18px; background: var(--gray-bg);
  }
  .acb-num { font-size: 2rem; font-weight: 800; font-family: var(--f-mono); line-height: 1; }
  .acb-num.has-warn { color: var(--warn); }
  .acb-num.has-crit { color: var(--crit); }
  .acb-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700; color: var(--gray-text); }
  .acb-sub { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--gray-text); font-weight: 600; margin-top: 2px; }

  /* MAIN DASHBOARD GRID — viewport-height 2-col layout */
  .dashboard {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 360px;
    height: calc(100vh - 93px); /* 52px header + 41px status bar */
    overflow: hidden;
  }
  @media (max-width: 1200px) { .dashboard { grid-template-columns: minmax(0, 1fr) 320px; } }
  @media (max-width: 1024px) { .dashboard { grid-template-columns: 1fr; height: auto; overflow: visible; } }
  .panel { border: 1px solid var(--gray-border); background: var(--white); display: flex; flex-direction: column; }
  .panel-hd {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--gray-border); background: var(--gray-bg);
  }
  .panel-hd h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 700; }
  .panel-hd .meta { font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gray-text); font-weight: 700; font-family: var(--f-mono); }

  /* MAP PANEL */
  .map-panel {
    display: flex; flex-direction: column; min-width: 0;
    border-right: 1px solid var(--gray-border);
    overflow: hidden;
  }
  @media (max-width: 1024px) { .map-panel { border-right: 0; } }
  .view-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--gray-border); overflow-x: auto; scrollbar-width: none; flex-shrink: 0; }
  .view-tabs::-webkit-scrollbar { display: none; }
  .view-tab {
    flex: 1; min-width: 0; padding: 13px 10px;
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700;
    color: var(--gray-text); white-space: nowrap;
    border-right: 1px solid var(--gray-border); background: var(--white);
    transition: all .15s; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .view-tab:last-child { border-right: 0; }
  .view-tab:hover { background: var(--gray-bg); color: var(--black); }
  .view-tab.on { background: var(--black); color: var(--white); border-color: var(--black); }
  .view-tab .icon { width: 14px; height: 14px; opacity: 0.7; }
  .view-tab.on .icon { opacity: 1; }
  .map-frame {
    background: var(--gray-bg); position: relative;
    flex: 1; min-height: 0; overflow: hidden;
  }
  @media (max-width: 1024px) { .map-frame { min-height: 480px; } }
  html[data-theme="dark"] .map-frame { background: #0c0c0c; }
  .map-wrap { width: 100%; height: 100%; position: relative; min-height: 0; }
  /* MapLibre overrides to match editorial style */
  .maplibregl-map { font-family: var(--f-sans) !important; }
  .maplibregl-ctrl-attrib { font-size: 9px !important; opacity: 0.5 !important; }
  .maplibregl-ctrl-bottom-right { bottom: 4px !important; right: 4px !important; }
  /* No-storm overlay */
  .no-storm-overlay {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,.94); border: 1px solid var(--gray-border);
    padding: 8px 16px; font-size: 10px; text-transform: uppercase;
    letter-spacing: .18em; font-weight: 700; color: var(--gray-text);
    white-space: nowrap; pointer-events: none; z-index: 5;
  }
  .maplibregl-ctrl-logo { display: none !important; }
  .map-bottom-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; border-top: 1px solid var(--gray-border); background: var(--gray-bg);
  }
  .legend-items { display: flex; gap: 18px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; color: var(--gray-text); }
  .legend-item .swatch { width: 14px; height: 8px; }
  .legend-item .num { color: var(--gray-dim); margin-left: 3px; font-family: var(--f-mono); }
  .legend-item .dot { width: 8px; height: 8px; border-radius: 50%; }
  .scale-readout { font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gray-text); font-family: var(--f-mono); }

  /* RIGHT COLUMN — scrollable sidebar */
  .right-col {
    display: flex; flex-direction: column; min-width: 0;
    overflow-y: auto; overflow-x: hidden;
    border-left: 0; /* handled by map-panel border-right */
    background: var(--white);
  }
  .right-col .panel { border-bottom: 1px solid var(--gray-border); border-left: 0; border-right: 0; border-top: 0; }
  .right-col .panel:first-child { border-top: 0; }
  @media (max-width: 1024px) { .right-col { overflow-y: visible; border-top: 1px solid var(--gray-border); } }
  .ts-card { padding: 0; }
  .ts-card-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .ts-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .ts-name { font-size: 1.15rem; font-weight: 800; text-transform: uppercase; letter-spacing: -0.01em; line-height: 1.1; }
  .ts-sub { font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--gray-text); font-weight: 600; margin-top: 4px; }
  .ts-tag { padding: 4px 8px; background: var(--crit); color: white; font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 800; }
  .ts-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border: 1px solid var(--gray-border); }
  .ts-cell { padding: 12px; border-right: 1px solid var(--gray-border); }
  .ts-cell:last-child { border-right: 0; }
  .ts-cell .v { font-family: var(--f-mono); font-size: 1.05rem; font-weight: 800; line-height: 1; }
  .ts-cell .l { font-size: 9px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--gray-text); font-weight: 700; margin-top: 6px; }
  .ts-bar-row { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; height: 38px; align-items: end; }
  .ts-bar { background: var(--gray-deep); }
  .ts-bar.hur { background: var(--crit); }
  .ts-bar.now { outline: 1.5px solid var(--black); outline-offset: -1px; }
  .ts-bar-labels { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; margin-top: 4px; }
  .ts-bar-labels span { font-size: 8.5px; color: var(--gray-text); font-family: var(--f-mono); text-align: center; }
  .ts-next {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; background: var(--gray-bg); border: 1px solid var(--gray-border);
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gray-text); font-weight: 600;
  }
  .ts-next strong { color: var(--black); }
  .ts-link { color: var(--crit); font-weight: 800; border-bottom: 1px solid var(--crit); padding-bottom: 2px; }

  /* CURRENT CONDITIONS */
  .cc-body { padding: 16px; }
  .cc-top { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; margin-bottom: 14px; }
  .cc-temp { font-size: 3rem; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
  .cc-temp .deg { font-size: 1.4rem; color: var(--gray-text); font-weight: 600; vertical-align: top; }
  .cc-cond { display: flex; flex-direction: column; align-items: flex-end; }
  .cc-cond .city { font-size: 11px; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 800; }
  .cc-cond .desc { font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gray-text); font-weight: 600; margin-top: 4px; }
  .cc-cond .hilo { font-size: 12px; font-family: var(--f-mono); color: var(--gray-text); margin-top: 6px; }
  .cc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 0; border-top: 1px solid var(--gray-border); }
  .cc-cell { padding: 10px 6px; border-right: 1px solid var(--gray-border); text-align: center; }
  .cc-cell:last-child { border-right: 0; }
  .cc-cell .v { font-family: var(--f-mono); font-size: 14px; font-weight: 800; }
  .cc-cell .l { font-size: 8.5px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gray-text); font-weight: 700; margin-top: 4px; }
  .cc-cell .u { font-size: 9px; color: var(--gray-text); font-weight: 600; margin-left: 2px; }

  /* ALERTS LIST */
  .alerts-list { display: flex; flex-direction: column; }
  .alert-row { padding: 12px 16px; border-bottom: 1px solid var(--gray-border); display: flex; gap: 12px; align-items: flex-start; }
  .alert-row:last-child { border-bottom: 0; }
  .alert-row:hover { background: var(--gray-bg); cursor: pointer; }
  .alert-row-bar { width: 4px; align-self: stretch; flex-shrink: 0; }
  .alert-row-bar.WARNING { background: var(--crit); }
  .alert-row-bar.WATCH { background: var(--warn); }
  .alert-row-bar.ADVISORY { background: var(--gray-text); }
  .alert-row-bar.INFO { background: var(--info); }
  .alert-row-body { flex: 1; min-width: 0; }
  .alert-row-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .alert-row-level { font-size: 9px; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 800; }
  .alert-row-level.WARNING { color: var(--crit); }
  .alert-row-level.WATCH { color: var(--warn); }
  .alert-row-level.ADVISORY { color: var(--gray-deep); }
  .alert-row-level.INFO { color: var(--info); }
  .alert-row-time { font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gray-text); font-family: var(--f-mono); }
  .alert-row-title { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.15; margin-top: 4px; }
  .alert-row-area { font-size: 10px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--gray-text); font-weight: 600; margin-top: 4px; }
  .alert-row-chevron { font-size: 10px; color: var(--gray-dim); margin-left: auto; flex-shrink: 0; transition: transform .2s; }
  .alert-row.expanded .alert-row-chevron { transform: rotate(180deg); }
  .alert-row-detail {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--gray-border);
    font-size: 12px; color: var(--gray-deep); line-height: 1.55;
  }
  .alert-row-footer { display: flex; justify-content: flex-end; margin-top: 8px; }
  .alert-nws-link {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.18em; font-weight: 700;
    color: var(--crit); border-bottom: 1px solid var(--crit); padding-bottom: 1px;
  }

  /* FORECAST STRIP — hidden on desktop (sidebar shows instead), visible when layout collapses */
  .forecast-strip-wrap { max-width: 1920px; margin: 0 auto 24px; padding: 0 32px; display: none; }
  @media (max-width: 1024px) { .forecast-strip-wrap { display: block; } }

  /* FORECAST SIDEBAR — visible on desktop, hidden when layout collapses (strip takes over) */
  .fc-sidebar-panel { display: flex; flex-direction: column; }
  @media (max-width: 1024px) { .fc-sidebar-panel { display: none; } }
  .forecast-strip {
    display: grid; grid-template-columns: 200px repeat(7, minmax(0, 1fr));
    border: 1px solid var(--gray-border); background: var(--white);
  }
  .fs-label { padding: 18px 20px; border-right: 1px solid var(--gray-border); background: var(--gray-bg); display: flex; flex-direction: column; justify-content: center; }
  .fs-label .h { font-size: 11px; text-transform: uppercase; letter-spacing: 0.2em; font-weight: 800; }
  .fs-label .s { font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gray-text); font-weight: 600; margin-top: 4px; }
  .fs-day {
    padding: 14px 8px; border-right: 1px solid var(--gray-border);
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    text-align: center; position: relative;
  }
  .fs-day:last-child { border-right: 0; }
  .fs-day.today { background: var(--gray-bg); }
  .fs-day.today::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--black); }
  .fs-day.severe::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--crit); }
  .fs-dow { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.22em; font-weight: 700; color: var(--gray-text); }
  .fs-day.today .fs-dow { color: var(--black); }
  .fs-date { font-size: 9px; color: var(--gray-dim); font-family: var(--f-mono); margin-top: -3px; }
  .fs-temps { display: flex; gap: 6px; align-items: baseline; }
  .fs-hi { font-size: 1.15rem; font-weight: 800; letter-spacing: -0.02em; }
  .fs-lo { font-size: 0.85rem; color: var(--gray-text); }
  .fs-cond { font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; font-weight: 600; color: var(--gray-text); line-height: 1.25; min-height: 22px; }
  .fs-day.severe .fs-cond { color: var(--crit); }
  .fs-bot { display: flex; gap: 10px; font-size: 9.5px; color: var(--gray-text); font-family: var(--f-mono); }
  .fs-bot .extreme { color: var(--crit); font-weight: 800; }

  /* FORECAST SIDEBAR — compact row layout for the 360px right column */
  .fc-sidebar { display: flex; flex-direction: column; }
  .fc-row {
    display: grid;
    grid-template-columns: 38px 36px 1fr 46px 28px;
    align-items: center; gap: 8px;
    padding: 9px 14px;
    border-bottom: 1px solid var(--gray-border);
    font-size: 11px; transition: background .1s;
  }
  .fc-row:last-child { border-bottom: 0; }
  .fc-row.fc-today { background: var(--gray-bg); }
  .fc-row.fc-today .fc-dow { color: var(--black); font-weight: 800; }
  .fc-row.fc-severe .fc-cond { color: var(--crit); }
  .fc-dow { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; color: var(--gray-text); }
  .fc-date { font-size: 9px; font-family: var(--f-mono); color: var(--gray-dim); }
  .fc-cond { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; color: var(--gray-text); line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fc-temps { font-size: 12px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; text-align: right; }
  .fc-temps .lo { font-size: 10px; color: var(--gray-text); font-weight: 500; margin-left: 3px; }
  .fc-pop { font-size: 9.5px; font-family: var(--f-mono); color: var(--gray-text); text-align: right; }

  /* BELOW THE FOLD */
  .below { border-top: 1px solid var(--gray-border); background: var(--gray-bg); padding: 56px 32px; }
  .below-inner { max-width: 1920px; margin: 0 auto; }
  .below-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 48px; align-items: flex-start; }
  @media (max-width: 1024px) { .below-grid { grid-template-columns: 1fr; } }
  .below h2 { font-size: 1.8rem; text-transform: uppercase; letter-spacing: -0.02em; line-height: 1.05; font-weight: 800; }
  .below p { font-size: 14px; color: var(--gray-text); line-height: 1.6; margin-top: 14px; }

  /* CONVERSION CARD (replaces member sign-in — low friction) */
  .conversion-card { padding: 28px; background: var(--white); border: 1px solid var(--gray-border); }
  .conversion-card h3 { font-size: 1rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 800; line-height: 1.2; }
  .conversion-card p { font-size: 13px; color: var(--gray-text); margin: 12px 0 18px; line-height: 1.5; }
  .conversion-features { list-style: none; padding: 0; margin: 0 0 20px; }
  .conversion-features li {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 600;
    color: var(--gray-text); padding: 8px 0; border-bottom: 1px solid var(--gray-border);
    display: flex; gap: 10px; align-items: center;
  }
  .conversion-features li:last-child { border-bottom: 0; }
  .conversion-features li::before { content: "+"; color: var(--black); font-weight: 800; }


  /* SIMS conversion card CTA button */
  .btn-sims-cta {
    display: block; width: 100%; padding: 16px; text-align: center;
    border: 1.5px solid var(--black); background: var(--black); color: var(--white);
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.22em; font-weight: 800;
    transition: all .2s; cursor: pointer; text-decoration: none; margin-top: 22px;
  }
  .btn-sims-cta:hover { background: transparent; color: var(--black); }
  .sims-stat {
    display: grid; grid-template-columns: 1fr 1fr; gap: 0;
    border: 1px solid var(--gray-border); margin-bottom: 20px;
  }
  .sims-stat-cell {
    padding: 14px 12px; border-right: 1px solid var(--gray-border);
    display: flex; flex-direction: column; gap: 4px;
  }
  .sims-stat-cell:last-child { border-right: 0; }
  .sims-stat-cell .sv { font-family: var(--f-mono); font-size: 1.4rem; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
  .sims-stat-cell .sl { font-size: 9px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--gray-text); font-weight: 700; margin-top: 2px; line-height: 1.3; }

  /* SKELETON loader */
  .skeleton { background: var(--gray-border); border-radius: 2px; animation: shimmer 1.4s ease-in-out infinite; }
  @keyframes shimmer { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .sk-text { height: 14px; margin: 6px 0; }
  .sk-title { height: 28px; margin: 8px 0; }
  .sk-block { height: 80px; margin: 12px 0; }

  /* DATA STALE NOTICE */
  .stale-notice {
    max-width: 1920px; margin: 0 auto; padding: 8px 32px;
    background: var(--warn-bg); border-bottom: 1px solid var(--warn);
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.15em; color: var(--warn); font-weight: 700;
    display: flex; align-items: center; gap: 10px;
  }

  /* FOOTER */
  footer { padding: 28px 32px; text-align: center; font-size: 10px; text-transform: uppercase; letter-spacing: 0.18em; color: var(--gray-text); border-top: 1px solid var(--gray-border); }

  /* LANG */
  body.lang-en .es { display: none !important; }
  body.lang-es .en { display: none !important; }

  /* RESPONSIVE */
  @media (max-width: 900px) {
    .header-container { padding: 0 18px; flex-wrap: wrap; }
    .nav-links { display: none; }
    .status-bar { flex-wrap: wrap; }
    .sb-segment { padding: 8px 14px; }
    .sb-status { padding: 8px 14px; }
    .forecast-strip-wrap { padding: 0 18px; }
    .forecast-strip { grid-template-columns: repeat(7, minmax(80px, 1fr)); overflow-x: auto; }
    .fs-label { display: none; }
    .below { padding: 32px 18px; }
  }

  /* ARTICLE LINK CARDS */
  .article-link-card {
    display: flex; flex-direction: column; gap: 6px;
    padding: 20px; border: 1px solid var(--gray-border); background: var(--white);
    text-decoration: none; color: inherit; transition: border-color .15s;
  }
  .article-link-card:hover { border-color: var(--black); }

  .alc-title { font-size: 15px; font-weight: 800; line-height: 1.2; margin-top: 6px; }
  .alc-teaser { font-size: 13px; color: var(--gray-text); line-height: 1.5; margin-top: 4px; flex: 1; }
  .alc-cta { font-size: 9.5px; text-transform: uppercase; letter-spacing: .18em; font-weight: 700; color: var(--black); margin-top: 10px; }

  /* STALE NOTICE reload button */
  .stale-reload-btn {
    margin-left: auto; padding: 4px 10px; font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .15em; cursor: pointer;
    border: 1px solid var(--warn); background: transparent; color: var(--warn);
    font-family: var(--f-mono); transition: all .15s; white-space: nowrap;
  }
  .stale-reload-btn:hover { background: var(--warn); color: white; }

  /* Hide MapLibre attribution controls entirely */
  .maplibregl-ctrl-attrib { display: none !important; }
  .maplibregl-ctrl-attrib-button { display: none !important; }
</style>
</head>

  stopRadarAnim(state);
  // Hide everything
  ALL_DATA_LAYERS.forEach(id => { try { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'none'); } catch {} });
  (state.rainfallMarkers || []).forEach(m => { m.getElement().style.display = 'none'; });
  if (state.isohyetLayer) state.isohyetLayer.hide();
  // Wind particles — show in wind view and composite
  if (state.windParticles) {
    if (v === 'wind' || v === 'composite') state.windParticles.start();
    else state.windParticles.stop();
  }
  // Animated radar for radar + composite
  if (v === 'radar' || v === 'composite') {
    const frames = state.radarFrames;
    if (frames.length) {
      let i = 0;
      const step = () => {
        frames.forEach((f, j) => { try { if (map.getLayer(f.id)) map.setLayoutProperty(f.id, 'visibility', j === i ? 'visible' : 'none'); } catch {} });
        i = (i + 1) % frames.length;
      };
      step();
      state.radarTimer = setInterval(step, 600);
    }
  }
  // Alert zones
  if (v === 'composite' || v === 'track') {
    ['nws-alert-fill','nws-alert-outline'].forEach(id => { try { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'visible'); } catch {} });
  }
  // Rainfall: QPF markers + isohyet canvas
  if (v === 'rainfall') {
    (state.rainfallMarkers || []).forEach(m => { m.getElement().style.display = 'flex'; });
    if (state.isohyetLayer) state.isohyetLayer.show();
  }
  // NHC cone + track — only view that zooms out
  if (v === 'track') {
    ['nhc-cone-fill','nhc-cone-outline','nhc-track-line','nhc-track-points'].forEach(id => { try { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', 'visible'); } catch {} });
    if (state.hasStorm) {
      map.fitBounds([[-75, 13], [-58, 25]], { padding: 30, duration: 800 });
    } else {
      map.fitBounds(PR_BOUNDS, { padding: 10, duration: 600 });
    }
  }
  // All other views: preserve the user's current pan/zoom
}

// ── Wind particle system ──────────────────────────────────────────────────
function createWindParticles(map, container) {
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2;display:none;';
  container.appendChild(canvas);

  const LAT_MIN=17.88, LAT_MAX=18.55, LNG_MIN=-67.40, LNG_MAX=-65.15;
  const COUNT = 650;
  const SPEED = 0.06; // px/frame per mph

  let grid = [];
  let running = false;
  let rafId = null;

  const pts = Array.from({length: COUNT}, () => ({
    lat: LAT_MIN + Math.random() * (LAT_MAX - LAT_MIN),
    lng: LNG_MIN + Math.random() * (LNG_MAX - LNG_MIN),
    age: Math.floor(Math.random() * 120),
    maxAge: 80 + Math.floor(Math.random() * 120),
  }));

  function windAt(lat, lng) {
    if (!grid.length) return {u:2, v:0}; // gentle default easterly
    let sw=0, su=0, sv=0;
    for (const g of grid) {
      const w = 1 / ((g.lat-lat)**2 + (g.lng-lng)**2 + 1e-8);
      sw+=w; su+=w*g.u; sv+=w*g.v;
    }
    return {u:su/sw, v:sv/sw};
  }

  function tick() {
    const W = container.clientWidth, H = container.clientHeight;
    if (!W || !H) { if (running) rafId = requestAnimationFrame(tick); return; }
    if (canvas.width !== W || canvas.height !== H) { canvas.width=W; canvas.height=H; }
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';

    for (const p of pts) {
      const {u,v} = windAt(p.lat, p.lng);
      const {x,y} = map.project([p.lng, p.lat]);
      const nx = x + u*SPEED, ny = y - v*SPEED;
      const np = map.unproject([nx, ny]);
      p.age++;
      if (p.age > p.maxAge || np.lat<LAT_MIN || np.lat>LAT_MAX || np.lng<LNG_MIN || np.lng>LNG_MAX) {
        p.lat = LAT_MIN + Math.random()*(LAT_MAX-LAT_MIN);
        p.lng = LNG_MIN + Math.random()*(LNG_MAX-LNG_MIN);
        p.age = 0; p.maxAge = 80 + Math.floor(Math.random()*120);
        continue;
      }
      p.lat=np.lat; p.lng=np.lng;
      const spd = Math.sqrt(u*u+v*v);
      const a = Math.sin(Math.PI*p.age/p.maxAge) * Math.min(1, spd/8) * 0.72;
      if (a < 0.04) continue;
      const clr = spd<10 ? `rgba(40,110,230,${a.toFixed(2)})` : spd<20 ? `rgba(20,175,140,${a.toFixed(2)})` : `rgba(210,85,30,${a.toFixed(2)})`;
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(nx,ny);
      ctx.strokeStyle=clr; ctx.lineWidth=1.5; ctx.stroke();
    }
    if (running) rafId = requestAnimationFrame(tick);
  }

  return {
    start() {
      if (running) return;
      running = true; canvas.style.display = '';
      rafId = requestAnimationFrame(tick);
    },
    stop() {
      running = false;
      if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
      canvas.style.display = 'none';
      const ctx = canvas.getContext('2d');
      if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
    },
    setGrid(g) { grid = g; },
    destroy() { running=false; if(rafId){cancelAnimationFrame(rafId);} canvas.remove(); },
  };
}

function formatMovement(m) {
  if (!m) return '—';
  return String(m).replace(/^(\w+)\s+at\s+(\d+)\s*mph$/i, '$1 · $2 mph');
}

// ── LiveClock ─────────────────────────────────────────────────────────────
function LiveClock() {
  const [t, setT] = useState(new Date());
  useEffect(() => {
    const i = setInterval(() => setT(new Date()), 1000);
    return () => clearInterval(i);
  }, []);
  const ast = new Date(t.toLocaleString('en-US', { timeZone: 'America/Puerto_Rico' }));
  const hh = String(ast.getHours()).padStart(2, '0');
  const mm = String(ast.getMinutes()).padStart(2, '0');
  const MONS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dateStr = `${MONS[ast.getMonth()]} ${ast.getDate()}`;
  return <span className="mono" style={{letterSpacing:'.08em'}}>{dateStr} · {hh}:{mm}</span>;
}

function createIsohyetLayer(map, container, stations) {
  const canvas = document.createElement('canvas');
  canvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;display:none;';
  container.appendChild(canvas);

  // Light → dark as rain accumulates. v < 0.01 = no rain → transparent (map shows through).
  const BAND_RGBA = [
    [181,217,248],  // 0.01–0.25"  trace  (lightest blue)
    [114,184,239],  // 0.25–0.5"
    [ 46,144,216],  // 0.5–1.0"
    [ 18,112,184],  // 1.0–1.5"
    [ 11, 84,144],  // 1.5–2.5"
    [ 13, 61,104],  // 2.5–3.5"
    [ 15, 42, 70],  // 3.5"+       (darkest navy)
  ];
  const THRESHOLDS = [0.01, 0.25, 0.5, 1.0, 1.5, 2.5, 3.5];
  const STEP = 4;

  function render() {
    if (canvas.style.display === 'none') return;
    const W = container.clientWidth;
    const H = container.clientHeight;
    if (!W || !H) return;
    canvas.width = W;
    canvas.height = H;
    const ctx = canvas.getContext('2d');

    const pts = stations
      .filter(st => st.totalIn >= 0 && st.lat && st.lng)
      .map(st => {
        const p = map.project([st.lng, st.lat]);
        return { x: p.x, y: p.y, v: st.totalIn, source: st.source };
      });
    if (pts.length < 3) return;

    // Only color pixels within MAX_R of an actual station — ocean/far areas stay transparent
    const MAX_R  = Math.max(90, W * 0.09);
    const MAX_R2 = MAX_R * MAX_R;
    const FADE   = 0.72; // fade-out starts at 72% of MAX_R

    const cols = Math.ceil(W / STEP);
    const rows = Math.ceil(H / STEP);
    const grid  = new Float32Array(cols * rows);
    const ndist = new Float32Array(cols * rows);

    for (let r = 0; r < rows; r++) {
      const py = r * STEP;
      for (let c = 0; c < cols; c++) {
        const px = c * STEP;
        let sw = 0, sv = 0, nd2 = Infinity;
        for (const p of pts) {
          const dx = px - p.x, dy = py - p.y;
          const d2 = dx*dx + dy*dy || 1e-9;
          if (d2 < nd2) nd2 = d2;
          const w = 1 / (d2 * d2);
          sw += w; sv += w * p.v;
        }
        const gi = r * cols + c;
        grid[gi]  = sv / sw;
        ndist[gi] = nd2;
      }
    }

    const imgData = ctx.createImageData(W, H);
    const px4 = imgData.data;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const gi  = r * cols + c;
        const nd2 = ndist[gi];
        if (nd2 > MAX_R2) continue;       // beyond station influence → transparent
        const v = grid[gi];
        if (v < 0.01) continue;           // no rain → transparent, let map show

        let bi = 0;
        for (let t = THRESHOLDS.length - 1; t >= 0; t--) { if (v >= THRESHOLDS[t]) { bi = t; break; } }
        const [br, bg, bb] = BAND_RGBA[bi];

        const nd  = Math.sqrt(nd2);
        const fa  = nd > MAX_R * FADE ? Math.max(0, 1 - (nd - MAX_R*FADE) / (MAX_R*(1-FADE))) : 1;
        const alp = Math.round(152 * fa);
        if (alp <= 0) continue;

        const py0 = r * STEP, px0 = c * STEP;
        for (let dy = 0; dy < STEP && py0+dy < H; dy++) {
          for (let dx = 0; dx < STEP && px0+dx < W; dx++) {
            const i = ((py0+dy)*W + (px0+dx)) * 4;
            px4[i]=br; px4[i+1]=bg; px4[i+2]=bb; px4[i+3]=alp;
          }
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);

    // Dashed isohyet contour lines at each threshold boundary
    ctx.setLineDash([3, 3]);
    ctx.lineWidth = 0.65;
    for (let t = 0; t < THRESHOLDS.length; t++) {
      const tv = THRESHOLDS[t];
      ctx.strokeStyle = t >= 3 ? 'rgba(255,255,255,0.28)' : 'rgba(255,255,255,0.16)';
      ctx.beginPath();
      for (let r = 0; r < rows - 1; r++) {
        for (let c = 0; c < cols - 1; c++) {
          const gi = r * cols + c;
          if (ndist[gi] > MAX_R2) continue;
          const v  = grid[gi];
          const vr = grid[gi + 1];
          const vd = grid[(r+1) * cols + c];
          if ((v < tv) !== (vr < tv)) { ctx.moveTo((c+1)*STEP, r*STEP); ctx.lineTo((c+1)*STEP, (r+1)*STEP); }
          if ((v < tv) !== (vd < tv)) { ctx.moveTo(c*STEP, (r+1)*STEP); ctx.lineTo((c+1)*STEP, (r+1)*STEP); }
        }
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);

    // Subtle station markers
    const R = 3.5;
    ctx.textAlign = 'center';
    pts.forEach(p => {
      ctx.lineWidth = 1.1;
      ctx.strokeStyle = 'rgba(255,255,255,0.80)';
      ctx.fillStyle   = 'rgba(0,0,0,0.25)';
      ctx.beginPath();
      if (p.source === 'cocorahs') {
        ctx.arc(p.x, p.y, R, 0, Math.PI * 2);
      } else {
        ctx.rect(p.x - R, p.y - R, R * 2, R * 2);
      }
      ctx.fill();
      ctx.stroke();
      if (p.v >= 0.01) {
        ctx.font = 'bold 9px monospace';
        ctx.fillStyle = 'rgba(255,255,255,0.88)';
        ctx.fillText(p.v.toFixed(2) + '"', p.x, p.y - R - 3);
      }
    });
  }

  // Redraw only after pan/zoom ends — avoids blocking animation frames
  const onEnd = () => render();
  map.on('moveend', onEnd);
  map.on('zoomend', onEnd);
  map.on('resize',  onEnd);

  return {
    show()    { canvas.style.display = ''; render(); },
    hide()    { canvas.style.display = 'none'; },
    destroy() { map.off('moveend', onEnd); map.off('zoomend', onEnd); map.off('resize', onEnd); canvas.remove(); },
  };
}

function PRMap({ view, hurricane }) {
  const containerRef = useRef(null);
  const stateRef = useRef({ map: null, loaded: false, radarFrames: [], radarTimer: null, windParticles: null, rainfallMarkers: [], isohyetLayer: null, hasStorm: false, rainfallDry: false });
  const viewRef = useRef(view);
  const [rainfallDry, setRainfallDry] = useState(false);

  // React to view changes after map is ready
  useEffect(() => {
    viewRef.current = view;
    const s = stateRef.current;
    if (s.map && s.loaded) applyMapView(s, view);
  }, [view]);

  // One-time map init
  useEffect(() => {
    if (!containerRef.current || stateRef.current.map) return;
    const s = stateRef.current;

    const map = new maplibregl.Map({
      container: containerRef.current,
      style: 'https://tiles.openfreemap.org/styles/liberty',
      bounds: PR_BOUNDS,           // Rincón (west) → Culebra (east) on init
      fitBoundsOptions: { padding: 10 },
      attributionControl: false,
      maxBounds: [[-80, 12], [-55, 28]],
    });
    s.map = map;
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

    map.on('style.load', async () => {
      // ── NWS Alert zones ──────────────────────────────────────────────
      let alertFC = { type: 'FeatureCollection', features: [] };
      try {
        const r = await fetch('https://api.weather.gov/alerts/active?area=PR');
        const d = await r.json();
        const enriched = await Promise.all((d.features || []).slice(0, 6).map(async f => {
          if (f.geometry) return f;
          const zones = f.properties?.affectedZones ?? [];
          if (!zones.length) return null;
          try {
            const zr = await fetch(zones[0]);
            const zd = await zr.json();
            return { ...f, geometry: zd.geometry };
          } catch { return null; }
        }));
        alertFC.features = enriched.filter(Boolean);
      } catch {}
      map.addSource('nws-alerts', { type: 'geojson', data: alertFC });
      map.addLayer({ id: 'nws-alert-fill', type: 'fill', source: 'nws-alerts',
        layout: { visibility: 'none' },
        paint: { 'fill-color': ['match',['get','severity'],'Extreme','#c41818','Severe','#c41818','Moderate','#d97706','#1e5fb8'], 'fill-opacity': 0.13 }
      });
      map.addLayer({ id: 'nws-alert-outline', type: 'line', source: 'nws-alerts',
        layout: { visibility: 'none' },
        paint: { 'line-color': ['match',['get','severity'],'Extreme','#c41818','Severe','#c41818','Moderate','#d97706','#1e5fb8'], 'line-width': 1.5, 'line-dasharray': [3,2] }
      });

      // ── RainViewer radar ──────────────────────────────────────────────
      try {
        const rv = await fetch('https://api.rainviewer.com/public/weather-maps.json');
        const rvd = await rv.json();
        const frames = rvd.radar.past.slice(-10).map(f => ({
          id: `rv-${f.time}`,
          url: `https://tilecache.rainviewer.com${f.path}/512/{z}/{x}/{y}/4/1_1.png`,
        }));
        s.radarFrames = frames;
        frames.forEach(f => {
          map.addSource(f.id, { type: 'raster', tiles: [f.url], tileSize: 512, attribution: '© RainViewer', minzoom: 1, maxzoom: 6 });
          map.addLayer({ id: f.id, type: 'raster', source: f.id, layout: { visibility: 'none' }, paint: { 'raster-opacity': 0.8 } });
        });
        // Static alias = last frame (used for composite)
        if (frames.length) {
          map.addSource('radar-current-src', { type: 'raster', tiles: [frames[frames.length-1].url], tileSize: 512, minzoom: 1, maxzoom: 6 });
          map.addLayer({ id: 'radar-current', type: 'raster', source: 'radar-current-src', layout: { visibility: 'none' }, paint: { 'raster-opacity': 0.7 } });
        } else {
          map.addSource('radar-current-src', { type: 'geojson', data: {type:'FeatureCollection',features:[]} });
          map.addLayer({ id: 'radar-current', type: 'fill', source: 'radar-current-src', layout: { visibility: 'none' } });
        }
      } catch (e) {
        console.warn('RainViewer failed:', e);
        map.addSource('radar-current-src', { type: 'geojson', data: {type:'FeatureCollection',features:[]} });
        map.addLayer({ id: 'radar-current', type: 'fill', source: 'radar-current-src', layout: { visibility: 'none' } });
      }

      // ── Wind particle system ─────────────────────────────────────────
      s.windParticles = createWindParticles(map, containerRef.current);
      try {
        const lats = [18.47,18.47,18.47,18.22,18.22,18.22,17.97,17.97,17.97];
        const lngs = [-67.15,-66.10,-65.60,-67.15,-66.10,-65.60,-67.15,-66.10,-65.60];
        const wurl = `https://api.open-meteo.com/v1/forecast?latitude=${lats.join(',')}&longitude=${lngs.join(',')}&current=wind_speed_10m,wind_direction_10m&wind_speed_unit=mph&timezone=America%2FPuerto_Rico`;
        const wr = await fetch(wurl);
        const wd = await wr.json();
        const windGrid = (Array.isArray(wd) ? wd : [wd]).map(loc => {
          const speed = loc.current?.wind_speed_10m ?? 0;
          const dir   = loc.current?.wind_direction_10m ?? 0;
          const rad   = dir * Math.PI / 180;
          return {
            lat: loc.latitude, lng: loc.longitude,
            u: -speed * Math.sin(rad), // eastward component
            v: -speed * Math.cos(rad), // northward component
          };
        });
        s.windParticles.setGrid(windGrid);
      } catch (e) { console.warn('Wind grid failed:', e); }

      // ── Open-Meteo QPF rainfall (HTML markers, same pattern as wind) ────
      try {
        const rlats = [18.47,18.47,18.47,18.22,18.22,18.22,17.97,17.97,17.97];
        const rlngs = [-67.15,-66.10,-65.60,-67.15,-66.10,-65.60,-67.15,-66.10,-65.60];
        const rurl = `https://api.open-meteo.com/v1/forecast?latitude=${rlats.join(',')}&longitude=${rlngs.join(',')}&daily=precipitation_sum&timezone=America%2FPuerto_Rico&forecast_days=1`;
        const rr = await fetch(rurl);
        const rd = await rr.json();
        const locs = Array.isArray(rd) ? rd : [rd];
        const maxMm = Math.max(...locs.map(loc => loc.daily?.precipitation_sum?.[0] ?? 0));
        const dry = maxMm < 2.5;
        stateRef.current.rainfallDry = dry;
        setRainfallDry(dry);
        locs.forEach(loc => {
          const mm = loc.daily?.precipitation_sum?.[0] ?? 0;
          const inches = mm / 25.4;
          const label = inches >= 0.1 ? `${inches.toFixed(1)}"` : '<0.1"';
          // Size 28–56px based on rainfall
          const sz = Math.round(28 + Math.min(mm / 40, 1) * 28);
          // Color intensity based on mm
          const alpha = Math.max(0.18, Math.min(0.88, 0.18 + (mm / 40) * 0.70));
          const el = document.createElement('div');
          el.style.cssText = `display:none;flex-direction:column;align-items:center;gap:2px;cursor:default;`;
          el.innerHTML = `
            <div style="
              width:${sz}px;height:${sz}px;border-radius:50%;
              background:rgba(30,60,120,${alpha.toFixed(2)});
              border:1.5px solid rgba(30,60,120,0.55);
              display:flex;align-items:center;justify-content:center;
            ">
              <span style="font-family:JetBrains Mono,monospace;font-size:9px;font-weight:800;color:rgba(255,255,255,0.95);">💧</span>
            </div>
            <div style="font-family:JetBrains Mono,monospace;font-size:10px;font-weight:800;color:#0a1828;background:rgba(255,255,255,0.88);padding:1px 4px;border:1px solid rgba(30,60,120,0.25);">${label}</div>
          `;
          const marker = new maplibregl.Marker({ element: el, anchor: 'center' })
            .setLngLat([loc.longitude, loc.latitude]).addTo(map);
          s.rainfallMarkers = s.rainfallMarkers || [];
          s.rainfallMarkers.push(marker);
        });
      } catch (e) { console.warn('Rainfall QPF failed:', e); }
      // ── Rain gauge stations (CoCoRaHS + USGS) — isohyet canvas ──────────
      s.isohyetLayer = null;
      try {
        const wr = await fetch('/api/weather/live');
        const wd = await wr.json();
        const stList = wd.rainfallStations ?? [];
        if (stList.length >= 3) {
          s.isohyetLayer = createIsohyetLayer(map, containerRef.current, stList);
        }
      } catch(e) { console.warn('[Sentinel] Station fetch failed:', e); }

      // Stub geojson sources (needed for applyMapView layer checks)
      map.addSource('rainfall-data', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
      map.addLayer({ id:'rainfall-circles', type:'fill', source:'rainfall-data', layout:{ visibility:'none' } });
      map.addLayer({ id:'rainfall-labels', type:'fill', source:'rainfall-data', layout:{ visibility:'none' } });

      // ── NHC Storm Track ───────────────────────────────────────────────
      const coneGeoJson = hurricane?.coneGeoJson ?? null;
      s.hasStorm = !!coneGeoJson;
      map.addSource('nhc-cone', { type:'geojson', data: coneGeoJson || { type:'FeatureCollection', features:[] } });
      map.addLayer({ id:'nhc-cone-fill', type:'fill', source:'nhc-cone', layout:{ visibility:'none' }, paint:{ 'fill-color':'#c41818','fill-opacity':0.1 } });
      map.addLayer({ id:'nhc-cone-outline', type:'line', source:'nhc-cone', layout:{ visibility:'none' }, paint:{ 'line-color':'#c41818','line-width':1.5,'line-dasharray':[4,3] } });
      map.addSource('nhc-track', { type:'geojson', data:{ type:'FeatureCollection', features:[] } });
      map.addLayer({ id:'nhc-track-line', type:'line', source:'nhc-track', layout:{ visibility:'none' }, paint:{ 'line-color':'#c41818','line-width':2.5 } });
      map.addLayer({ id:'nhc-track-points', type:'circle', source:'nhc-track', layout:{ visibility:'none' }, paint:{ 'circle-radius':6,'circle-color':'#c41818','circle-stroke-color':'white','circle-stroke-width':2 } });

      s.loaded = true;
      applyMapView(s, viewRef.current);
    });

    return () => {
      stopRadarAnim(s);
      if (s.windParticles) { s.windParticles.destroy(); s.windParticles = null; }
      if (s.isohyetLayer) { s.isohyetLayer.destroy(); s.isohyetLayer = null; }
      (s.rainfallMarkers || []).forEach(m => m.remove());
      s.rainfallMarkers = [];
      s.loaded = false;
      map.remove();
      stateRef.current = { map:null, loaded:false, radarFrames:[], radarTimer:null, windParticles:null, rainfallMarkers:[], isohyetLayer:null, hasStorm:false };
    };
  }, []); // intentionally empty — map initializes once

  const noStorm = view === 'track' && !hurricane;
  const showDryOverlay = view === 'rainfall' && rainfallDry;

  return (
    <div style={{ position:'relative', width:'100%', height:'100%', minHeight:420 }}>
      <div ref={containerRef} style={{ width:'100%', height:'100%', minHeight:420 }} />
      {noStorm && (
        <div className="no-storm-overlay">
          <span className="en">No active tropical systems · Caribbean &amp; Atlantic</span>
          <span className="es">Sin sistemas tropicales activos · Caribe y Atlántico</span>
        </div>
      )}
      {showDryOverlay && (
        <div className="no-storm-overlay">
          <span className="en">No significant rainfall expected · Next 24 hours</span>
          <span className="es">Sin lluvia significativa prevista · Próximas 24 horas</span>
        </div>
      )}
    </div>
  );
}

      <div className="fc-sidebar">
        {days.map((d, i) => {
          const isSevere = d.cond?.toLowerCase().includes('tropical') || d.cond?.toLowerCase().includes('storm');
          return (
            <div key={i} className={`fc-row ${i===0?'fc-today':''} ${isSevere?'fc-severe':''}`}>
              <span className="fc-dow">{i===0 ? <span className="en">TODAY</span> : d.day?.toUpperCase()}</span>
              <span className="fc-date">{d.date}</span>
              <span className="fc-cond">{d.cond}</span>
              <span className="fc-temps">{d.hi}°<span className="lo">{d.lo}°</span></span>
              <span className="fc-pop">↓{d.pop}%</span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ── Root App ──────────────────────────────────────────────────────────────
function App() {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [lang, setLang] = useState(() => {
    try { return localStorage.getItem('sentinelLang') || 'en'; } catch { return 'en'; }
  });
  const [view, setView] = useState('composite');
  const [showStale, setShowStale] = useState(false);
  const [showReloadBtn, setShowReloadBtn] = useState(false);
  const mountTime = useRef(Date.now());
  const REFRESH_MS = 5 * 60 * 1000; // 5 min

  // Fetch live data — falls back to demo payload when API is unreachable
  const fetchData = useCallback(async () => {
    try {
      const res = await fetch('/api/weather/live');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const json = await res.json();
      setData(json);
      if (json.hasActiveStorm && view === 'composite') setView('track');
    } catch (e) {
      console.warn('Weather API unavailable, using demo data:', e.message);
      // Show representative demo data so the page layout is always visible
      const now = new Date();
      const seasonStart = new Date(`${now.getFullYear()}-06-01T00:00:00-04:00`);
      const daysUntil = Math.max(0, Math.floor((seasonStart - now) / 86400000));
      const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      const demoSync = now.toLocaleString('en-US', { timeZone:'America/Puerto_Rico', hour:'numeric', minute:'2-digit', hour12:true }) + ' AST';
      setData({
        mode: 'watch',
        dataFresh: false,
        lastSync: demoSync,
        daysUntilSeason: daysUntil,
        seasonActive: daysUntil <= 0,
        hasActiveStorm: false,
        metrics: { activeAlerts: 2, totalAlerts: 3 },
        conditions: { temp:86, humidity:79, windMph:14, gustMph:22, rainIn:0, pressureInHg:30.04, visibilityMi:10, description:'Partly Cloudy', city:'San Juan' },
        forecast: Array.from({length:7}, (_,i) => {
          const d = new Date(); d.setDate(d.getDate()+i);
          return { day:DAYS[d.getDay()], date:`${d.getMonth()+1}/${d.getDate()}`, hi:88-i, lo:76, pop:30+i*8, wind:14+i*2, cond: i>=3&&i<=5?'Scattered Showers':'Partly Cloudy' };
        }),
        hurricane: null,
        alerts: [
          { id:'d1', level:'WATCH', source:'NWS San Juan', title:'Flash Flood Watch', area:'All Puerto Rico', issued:'Jun 23 · 9:14 AM AST', detail:'4 to 8 inches of rainfall expected through the weekend with isolated totals exceeding 12 inches in mountain regions.', isTropical:false },
          { id:'d2', level:'ADVISORY', source:'NWS', title:'Small Craft Advisory', area:'Coastal Waters', issued:'Jun 23 · 6:00 AM AST', detail:'Seas building to 8–12 ft. Hazardous conditions for small vessels.', isTropical:false },
          { id:'d3', level:'INFO', source:'NMEAD', title:'Pre-Season Readiness Reminder', area:'Island-wide', issued:'Yesterday', detail:'Hurricane season begins June 1. Verify generator fuel, emergency comms, and shelter-in-place supplies.', isTropical:false },
        ],
      });
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { fetchData(); }, [fetchData]);
  useEffect(() => {
    const t = setInterval(fetchData, REFRESH_MS);
    return () => clearInterval(t);
  }, [fetchData]);

  // Stale-notice: don't show until 5 min after mount; reload btn after 1 more min
  useEffect(() => {
    if (!data) return;
    if (data.dataFresh) { setShowStale(false); setShowReloadBtn(false); return; }
    const elapsed = Date.now() - mountTime.current;
    const delay = Math.max(0, 5 * 60 * 1000 - elapsed);
    const t = setTimeout(() => setShowStale(true), delay);
    return () => clearTimeout(t);
  }, [data?.dataFresh]);

  useEffect(() => {
    if (!showStale) { setShowReloadBtn(false); return; }
    const t = setTimeout(() => setShowReloadBtn(true), 60 * 1000);
    return () => clearTimeout(t);
  }, [showStale]);

  // Lang
  useEffect(() => {
    document.body.classList.remove('lang-en', 'lang-es');
    document.body.classList.add('lang-' + lang);
    try { localStorage.setItem('sentinelLang', lang); } catch {}
  }, [lang]);

  if (loading) return (
    <div style={{padding:'32px',maxWidth:900,margin:'0 auto'}}>
      <div className="skeleton sk-title" style={{width:'40%'}}/>
      <div className="skeleton sk-text" style={{width:'60%'}}/>
      <div className="skeleton sk-block"/>
      <div className="skeleton sk-block"/>
    </div>
  );

  const hurricane = data?.hurricane ?? null;
  const alertCount = (data?.alerts ?? []).filter(a => a.level !== 'INFO').length;

  return (<>
    {showStale && (
      <div className="stale-notice">
        <span>⚠</span>
        <span className="en">Data may be delayed — last sync {data?.lastSync}</span>
        <span className="es">Los datos pueden estar retrasados — última sincronización {data?.lastSync}</span>
        {showReloadBtn && (
          <button className="stale-reload-btn" onClick={fetchData}>↺ Reload</button>
        )}
      </div>
    )}
    <Header lang={lang} setLang={setLang} alertCount={alertCount}/>
    {data && <StatusBar data={data}/>}

    <div className="dashboard">
      <MapPanel view={view} setView={setView} hurricane={hurricane}/>
      <div className="right-col">
        {hurricane && <TropicalSystemPanel hurricane={hurricane}/>}
        <CurrentConditions conditions={data?.conditions}/>
        <AlertsPanel alerts={data?.alerts}/>
        <ForecastSidebar forecast={data?.forecast}/>
      </div>
    </div>

    <ForecastStrip forecast={data?.forecast}/>
    <BelowFold alerts={data?.alerts}/>
    <Footer lastSync={data?.lastSync ?? '—'}/>
  </>);
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
